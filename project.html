<body class="subpage">
  <nav>
    <a href="index.html" class="brand"><span class="prompt">~/</span>ben</a>
    <div class="links links-static">
      <a href="projects.html">cd ../projects</a>
    </div>
  </nav>

  <main>
    <article id="project" class="project-page"></article>
  </main>

  <script src="projects.js"></script>
  <script src="contact.js"></script>
  <script>
    // Render one project from projects.js, chosen by ?id= in the URL.
    (() => {
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const id = new URLSearchParams(location.search).get('id');
      const p = (window.PROJECTS || []).find((x) => x.id === id);
      const el = document.getElementById('project');

      if (!p) {
        // Don't let search engines index the "not found" state.
        const robots = document.createElement('meta');
        robots.name = 'robots'; robots.content = 'noindex';
        document.head.appendChild(robots);
        el.innerHTML = `
          <p class="crumb">~/projects/${esc(id || '')}</p>
          <h1 class="big">Not found<span class="accent">.</span></h1>
          <p class="muted">bash: ${esc(id || 'project')}: No such file or directory</p>
          <p><a href="projects.html">← cd ../projects</a></p>`;
        return;
      }

      document.title = `ls ~/ben/projects/${p.id} · ${p.title} — Ben Whitrow`;
      // Per-project SEO/social tags (Google renders this JavaScript when indexing).
      const setMeta = (sel, attr, val) => { const m = document.querySelector(sel); if (m) m.setAttribute(attr, val); };
      const url = `https://benwhitrow.co.uk/project.html?id=${encodeURIComponent(p.id)}`;
      const desc = `${p.summary} A project by Ben Whitrow.`;
      setMeta('meta[name="description"]', 'content', desc);
      setMeta('link[rel="canonical"]', 'href', url);
      setMeta('meta[property="og:title"]', 'content', document.title);
      setMeta('meta[name="twitter:title"]', 'content', document.title);
      setMeta('meta[property="og:description"]', 'content', desc);
      setMeta('meta[name="twitter:description"]', 'content', desc);
      setMeta('meta[property="og:url"]', 'content', url);
      el.innerHTML = `
        <p class="crumb">~/projects/<span class="accent">${esc(p.id)}</span></p>
        <h1 class="big">${esc(p.title)}<span class="accent">.</span></h1>
        <div class="project-meta">
          ${p.year ? `<span class="date">${esc(p.year)}</span>` : ''}
          ${(p.tags || []).map((t) => `<a class="tag" href="projects.html?tag=${encodeURIComponent(t)}">${esc(t)}</a>`).join('')}
        </div>
        ${p.links?.length ? `<p class="project-links">${p.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</p>` : ''}
        ${p.image ? `<img class="project-image" src="${esc(p.image)}" alt="${esc(p.title)} screenshot" />` : ''}
        <div class="project-body">${p.body || ''}</div>
        <p class="back"><a href="projects.html">← cd ../projects</a></p>`;
    })();
  </script>
  <script src="footer.js"></script>
</body>
</html>
